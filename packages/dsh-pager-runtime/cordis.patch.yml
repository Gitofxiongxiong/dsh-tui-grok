# The dsh-tui-embedded bundle patch: the Embedded native-TUI backend over
# dsh-base. Stdout is reserved for TUI JSON-RPC frames. It mounts no HTTP
# server, Web runtime, or browser plugin. Model-facing tools and prompt
# sections come from a per-session agent preset; host-plane registries stay
# in dsh-base.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# Shared module-reload HMR writes diagnostics onto the process streams;
# stdout must stay a protocol pipe. The launcher's watch-only fallback still
# keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # TEMPORARY process-wide PTC opt-in. Unset keeps the schema default
    # (native). Per-session PTC is the `ptc` agent preset; do not set
    # this when sessions should choose a preset independently.
    mode: !!js process.env.DSH_TOOLS_MODE

# The base defaults to feedback-gated raw session export. The native TUI
# profile is explicitly local-only unless an operator chooses another profile.
- id: session-telemetry-otel
  disabled: true

- insert:
    # Agent presets enable model-selectable subagent delegation. The setting
    # owner is Host-scoped (the same contract used by the Web surface) so a
    # standing preset can sample it without publishing a process-global
    # service from inside its isolated agent realm.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Browse backend: no native dialog. The pager lists directories through
    # host.listDirectory / host.createDirectory.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    # Direct in-process Typert business owners used by the stdio bridge.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    # The external server adapts this public provider into its optional
    # fileReferences.list TUI method; the Harness host API itself is untouched.
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: tui-server
      name: '@dsh-pager-grok/runtime/server'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries.
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear if composition order
# changes. Host-plane services (sandbox, approval, persistence, llm, goals
# service, subagent registry, token meter, shell-env) stay enabled.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. Harness 0.1.2 supplies its trusted shipped root from the
# package and keeps the writable `$DSH_HOME/.agent-presets` user root.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Host-plane runner the `cordis` preset's plugin-experimentation tools wait on.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
