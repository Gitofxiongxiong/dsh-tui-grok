name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: cargo test
        run: cargo test --workspace --locked

  verify-ts:
    name: verify-ts (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: verify ts
        run: pnpm run verify:ts
