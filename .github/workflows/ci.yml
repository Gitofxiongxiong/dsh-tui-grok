name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: cargo test
        run: cargo test --workspace --locked

  verify-ts:
    name: verify-ts (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable Corepack
        run: corepack enable
      - name: checkout exact Harness alpha
        env:
          HARNESS_REF: dsh-v0.1.2-alpha.1
          HARNESS_COMMIT: cd5ef8148158c3a752a658978873241fdf8e2bbc
        run: |
          set -euo pipefail
          git clone --branch "${HARNESS_REF}" --depth 1 \
            https://github.com/deepseek-ai/deepseek-harness.git \
            ../deepseek-harness-latest
          test "$(git -C ../deepseek-harness-latest rev-parse HEAD)" = "${HARNESS_COMMIT}"
      - name: build Harness libraries
        working-directory: ../deepseek-harness-latest
        run: |
          corepack pnpm@11.7.0 install --frozen-lockfile
          corepack pnpm@11.7.0 run build:lib:host
          corepack pnpm@11.7.0 run build:lib:client
      - name: pnpm install
        run: corepack pnpm@11.20.0 install --frozen-lockfile
      - name: verify ts
        run: corepack pnpm@11.20.0 run verify:ts
