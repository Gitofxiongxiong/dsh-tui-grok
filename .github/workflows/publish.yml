# Trusted Publishing target for npm OIDC.
# Bind every @dsh-pager-grok/* package on npmjs.com to this filename.
name: publish

on:
  push:
    tags: ["v*"]
    branches: [ci/trust-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-smoke:
    name: trust-smoke
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build tui-protocol
        run: pnpm --filter @dsh-pager-grok/tui-protocol run build
      - name: install npm CLI for OIDC
        run: |
          npm install -g npm@11.15.0
          npm -v
      - name: publish prerelease via OIDC
        working-directory: packages/dsh-tui-protocol
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm -v
          npm pkg delete private
          npm version "0.1.1-trust.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --access public --tag trust-test
          echo "published @dsh-pager-grok/tui-protocol@0.1.1-trust.${GITHUB_RUN_ID} tag=trust-test"
