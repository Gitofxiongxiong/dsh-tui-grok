# Manual Trusted Publishing smoke target for npm OIDC.
# Bind @dsh-pager-grok/tui-protocol on npmjs.com to this filename.
# This workflow publishes a public prerelease; it must never run on push.
name: publish-smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-trust-test to publish a public npm prerelease"
        required: true
        type: string

concurrency:
  group: npm-trust-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trust-smoke:
    name: trust-smoke
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: confirm public prerelease
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "publish-trust-test" ]; then
            echo "::error::confirmation must equal publish-trust-test"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build tui-protocol
        run: pnpm --filter @dsh-pager-grok/tui-protocol run build
      - name: install npm CLI for OIDC
        run: |
          npm install -g npm@11.15.0
          npm -v
      - name: publish prerelease via OIDC
        working-directory: packages/dsh-tui-protocol
        env:
          TRUST_VERSION: 0.1.1-trust.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm -v
          npm pkg delete private
          npm version "${TRUST_VERSION}" --no-git-tag-version
          npm publish --access public --tag trust-test
          echo "published @dsh-pager-grok/tui-protocol@${TRUST_VERSION} tag=trust-test"
