[package]
name = "dsh-grok-textarea"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Apache-2.0 textarea primitive derived from Grok Build's xai-ratatui-textarea"

[dependencies]
crossterm = { workspace = true }
ratatui = { workspace = true, features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = { workspace = true }
textwrap = { workspace = true }
tui-scrollbar = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
chrono = "0.4"
itertools = "0.14"
pretty_assertions = "1"
rand = "0.9"

[features]
default = []
debug-logs = ["dep:tracing"]
