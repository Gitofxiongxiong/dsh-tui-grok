[package]
name = "dsh-pager-grok-ui"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Grok Build-derived DeepSeek Harness terminal UI and host adapter"

[dependencies]
anstyle = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
xai-ratatui-textarea = { package = "dsh-grok-textarea", path = "../dsh-grok-textarea" }
dsh-pager = { path = "../dsh-pager" }
dsh-pager-primitives = { path = "../dsh-pager-primitives" }
dsh-pager-protocol = { path = "../dsh-pager-protocol" }
dsh-pager-render = { path = "../dsh-pager-render" }
dsh-grok-inline = { path = "../dsh-grok-inline" }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
textwrap = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
xai-grok-markdown = { path = "vendor/grok/xai-grok-markdown" }

[dev-dependencies]
pretty_assertions = "1.4"
serial_test = "3.2"
tempfile = "3"
